<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>body{margin:0}</style>
<title>Vermietung</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vermietung">
<meta name="referrer" content="no-referrer">
<style>
/* Layout: iOS-artige Listen in einer schmalen Spalte, Tab-Leiste unten, Sperrbildschirm davor */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --field:#F6F7F9; --fg:#141A21; --muted:#5C6672; --line:#E0E4E9;
  --accent:#2B5C8A; --accent-fg:#FFFFFF; --accent-soft:#E3ECF5;
  --pos:#1F7A3A; --neg:#B3261E; --warn:#8F5B00; --warn-soft:#FBF1DC; --neg-soft:#FBE7E5;
  --c1:#2B5C8A; --c2:#C0892C; --c3:#5F78B0; --c4:#A0617B; --c5:#7E8C87;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1014; --surface:#161B21; --field:#1D232A; --fg:#E7EBF0; --muted:#949DA8; --line:#283039;
  --accent:#7FB0E0; --accent-fg:#0A1C2E; --accent-soft:#182838;
  --pos:#6CCB86; --neg:#FF8A80; --warn:#E5B24C; --warn-soft:#2E2512; --neg-soft:#331A18;
  --c1:#7FB0E0; --c2:#D9A54A; --c3:#8EA3D8; --c4:#CB8EA7; --c5:#8C9A95; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1014; --surface:#161B21; --field:#1D232A; --fg:#E7EBF0; --muted:#949DA8; --line:#283039;
  --accent:#7FB0E0; --accent-fg:#0A1C2E; --accent-soft:#182838;
  --pos:#6CCB86; --neg:#FF8A80; --warn:#E5B24C; --warn-soft:#2E2512; --neg-soft:#331A18;
  --c1:#7FB0E0; --c2:#D9A54A; --c3:#8EA3D8; --c4:#CB8EA7; --c5:#8C9A95; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
.num,.kpi,[data-k]{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Sperrbildschirm ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock-inner{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center}
.mark{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin:0 auto 4px}
.lock h1{font:700 28px/1.15 var(--font-display);margin:0;letter-spacing:-.01em}
.lock form{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lock input,.lock textarea{font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.lock textarea{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:90px;resize:vertical}
.err{color:var(--neg);min-height:1.2em;margin:0;font-size:14px}
.fine{font-size:12.5px;color:var(--muted);margin:8px 0 0;text-wrap:pretty}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5}
.add{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px;color:var(--accent);font-weight:600;cursor:pointer;text-align:left}
.del{flex:none;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.del:hover,.del:active{background:var(--neg-soft);color:var(--neg)}

/* ---------- App-Gerüst ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.topbar-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:46px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.topbar .spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--accent);font-weight:600;padding:8px 6px;cursor:pointer;font-size:16px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--pos);display:inline-block}
.status.busy i{background:var(--warn)}
main{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:2px calc(96px + env(safe-area-inset-bottom,0px))}
h1.title{font:700 30px/1.15 var(--font-display);letter-spacing:-.015em;margin:4px 2px 14px;text-wrap:balance}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-row h1{margin-bottom:14px}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:24px 4px 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.sec span[data-k]{text-transform:none;letter-spacing:0;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0;text-wrap:pretty}

.card{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 14px;border-top:1px solid var(--line);min-height:46px}
.card>.row:first-child,.card>:first-child .row:first-child{border-top:0}
.row .l{min-width:0;flex:1}
.row .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r small,.row .l small{display:block;font-size:12.5px;color:var(--muted)}
.row.total{font-weight:650}
.row.sub{padding-left:28px;font-size:14px;color:var(--muted)}
.row.go{cursor:pointer}
.chev{color:var(--muted);flex:none}
.row>span>.fld{width:100%}.row>span[style]{flex:none}

/* Eingabefelder (16px, damit iOS nicht zoomt) */
.fld{position:relative;display:block}
.in{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--field);color:var(--fg);border-radius:10px;padding:8px 26px 8px 10px;text-align:right;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.in.text,.in.date{text-align:left;padding-right:10px}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.fld .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.fld.nounit .in{padding-right:10px}
.name{font:inherit;font-size:16px;font-weight:600;border:1px solid transparent;background:transparent;color:var(--fg);border-radius:8px;padding:5px 6px;margin-left:-7px;width:100%;min-width:0}
.name:focus{outline:none;border-color:var(--accent);background:var(--field)}
select.in{text-align:left;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
label.cap{display:block;font-size:12px;color:var(--muted);margin:0 0 4px 2px}

/* Positions-Zeilen */
.item{padding:10px 14px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.card>.item:first-child{border-top:0}
.item-h{display:flex;align-items:center;gap:6px}
.item-g{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;align-items:end}
.item-g.three{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) auto}
.item-g .out{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;align-self:center}
.item-g .out small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
@media (max-width:380px){.item-g.three{grid-template-columns:1fr 1fr}.item-g.three .out{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}}

/* Kennzahlen */
.hero{padding:16px 16px 14px;display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpi{font:700 26px/1.15 var(--font-display);letter-spacing:-.02em;margin-top:2px;overflow-wrap:anywhere}
.kpi.sm{font-size:20px}
.subl{font-size:13px;color:var(--muted);margin-top:2px}

/* Verteilungsbalken */
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.bar>span{display:block;height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend b{color:var(--fg);font-weight:600}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;font-size:14px;margin-top:12px;text-wrap:pretty}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--neg-soft);color:var(--neg)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note button{margin-left:auto;flex:none}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--neg-soft);color:var(--neg)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}

/* Donut */
.donut-wrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.donut-wrap .legend{flex-direction:column;flex-wrap:nowrap;gap:7px}
.legend .lrow{display:flex;justify-content:space-between;gap:10px}

/* Tabellen */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-top:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
tr.em td{font-weight:650}

/* Fonds-Details */
details.item{gap:0}
details.item>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .l{flex:1;min-width:0}
details.item>summary .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item>summary .l small{color:var(--muted);font-size:12.5px}
details.item>summary .r{text-align:right;white-space:nowrap}
details.item>summary .r small{display:block;font-size:12.5px}
details.item[open]>summary .chev{transform:rotate(90deg)}
details.item .body{display:flex;flex-direction:column;gap:10px;padding-top:12px}

/* Segment */
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Diagramm */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer}
.tab svg{width:25px;height:25px}
.tab[aria-current="page"]{color:var(--accent)}

textarea.code{font:12.5px/1.4 ui-monospace,Menlo,monospace;width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--fg);padding:10px;resize:vertical}
.stack{display:flex;flex-direction:column;gap:10px;padding:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.bar>span{transition:width .25s ease}}

/* Ergänzungen Vermietung */
.tabbar-in{grid-template-columns:repeat(5,1fr)}
.row .fld{width:170px;flex:none}
.row .fld.wide{width:210px}
@media (max-width:380px){.row .fld{width:140px}}
.row a{color:var(--accent);text-decoration:none;font-weight:600}
.unitline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.when{font-size:12.5px;color:var(--muted)}
.sumhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;font-weight:650;background:var(--field);border-bottom:1px solid var(--line)}
textarea.in{text-align:left;min-height:80px;resize:vertical;padding:10px;font-size:16px}
.fld.wu .in{padding-right:46px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
.grid2 .full{grid-column:1/-1}
.objbar{display:flex;flex-direction:column;gap:10px}
.objbar .brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.objbar .track{grid-column:1/-1;height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.objbar .track span{display:block;height:100%}
.kpi.xl{font-size:34px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--field);border-radius:12px;padding:10px 10px 9px;min-width:0}
.tile .lbl{font-size:12px}
.tile .tv{font:700 18px/1.2 var(--font-display);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .subl{font-size:12px}
.status{font-size:13px}
.note b{font-weight:650}
.law .body p{margin:0 0 8px;font-size:14.5px;line-height:1.5;text-wrap:pretty}
.law .body ul,.law .body ol{margin:0 0 8px;padding-left:20px;font-size:14.5px;line-height:1.5}
.law .body li{margin:3px 0}
.law details.item>summary{padding:4px 0}
.law .body{padding-top:8px!important}
#dataBtn.on{color:var(--fg)}
.seg button{font-size:14px}
.lkbody,.lkcol{display:flex;flex-direction:column;gap:10px;margin-top:4px;text-align:left}
.lock input[type=text]{font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
#ulCode{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;text-transform:uppercase}
.rcode{font:600 19px/1.5 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:16px 10px;user-select:all;-webkit-user-select:all;word-break:break-all;color:var(--fg)}
.lock #lockMsg b{color:var(--fg)}
/* Web-App-Gerüst wie Finanzplanung v15: nur der Inhalt scrollt, Kopf- und Tab-Leiste bleiben fest */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
body::before{display:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
#app[hidden],.lock[hidden]{display:none!important}
#app .topbar{position:relative;top:auto;flex:none;padding-top:env(safe-area-inset-top,0px)}
#view{flex:1 1 auto;width:100%;max-width:none;margin:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-left:max(16px,env(safe-area-inset-left,0px),calc((100% - 680px)/2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100% - 680px)/2));padding-block:2px calc(96px + env(safe-area-inset-bottom,0px))}
#app .tabbar{position:absolute}
.lock{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;display:flex;flex-direction:column;padding-top:calc(32px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.lock-inner{margin:auto}
textarea.code{font-size:16px}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
</style>

</head>
<body>
<div id="lock" class="lock">
  <div class="lock-inner">
    <div class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5.5h4V20"/></svg>
    </div>
    <h1>Vermietung</h1>
    <p id="lockMsg" class="muted" style="margin:0">Wird geladen …</p>
    <div id="lkBody" class="lkbody"></div>
    <p class="err" id="lkErr" role="alert"></p>
    <p class="fine">Deine Daten sind mit AES‑256 verschlüsselt und bleiben auf diesem Gerät. Die App baut keine Verbindung ins Internet auf.</p>
    <p class="fine" id="verInfo" style="margin-top:0"></p>
  </div>
</div>

<div id="app" hidden>
  <div class="topbar"><div class="topbar-in">
    <button id="backBtn" class="iconbtn" type="button" hidden><svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2 2 10l8 8"/></svg><span id="backLbl">Zurück</span></button>
    <span id="saveStatus" class="status"><i></i>Gespeichert</span>
    <span class="spacer"></span>
    <button id="dataBtn" class="iconbtn" type="button" data-tab="daten" aria-label="Sicherheit &amp; Daten"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6"/><path d="M5 12v6c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-6"/></svg>Daten</button>
  </div></div>
  <main id="view"></main>
  <nav class="tabbar" aria-label="Bereiche"><div class="tabbar-in" id="tabs"></div></nav>
</div>

<script>
(() => {
'use strict';

/* ================= Hilfsfunktionen ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2,'0')).join('');

function parseNum(s){
  s = String(s ?? '').trim().replace(/[\s€% ]/g,'');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const n = parseFloat(s); return isFinite(n) ? n : 0;
}
const fmtIn = n => { const r = Math.round(n*1e6)/1e6; return String(r).replace('.',','); };
const nfE  = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});
const nfE0 = new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const nfP  = new Intl.NumberFormat('de-DE',{style:'percent',minimumFractionDigits:0,maximumFractionDigits:1});

const nfN2 = new Intl.NumberFormat('de-DE',{maximumFractionDigits:2});
function fmt(v,f){
  if (typeof v==='number' && !isFinite(v)) return '–';
  if (Math.abs(v) < 1e-9) v = 0;
  switch(f){
    case 'eur': return nfE.format(Math.abs(v)<0.005?0:v);
    case 'eur0': return nfE0.format(v);
    case 'pct': return nfP.format(v);
    case 'qm': return nfN1.format(v) + ' m²';
    case 'eqm': return nfE.format(v) + '/m²';
    case 'date': return v ? fmtDate(v) : '–';
    case 'txt': return String(v);
    default: return nfN2.format(v);
  }
}

const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s||''));
function fmtDate(s){ if(!isISO(s)) return String(s||''); const [y,m,d]=s.split('-'); return `${d}.${m}.${y}`; }
function edate(s,months){ // wie Excel EDATE
  const [y,m,d]=s.split('-').map(Number); const t=(m-1)+months; const ny=y+Math.floor(t/12), nm=((t%12)+12)%12;
  const last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();
  return `${ny}-${String(nm+1).padStart(2,'0')}-${String(Math.min(d,last)).padStart(2,'0')}`;
}
function daysBetween(a,b){ const p=s=>{const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,m-1,d);}; return Math.round((p(b)-p(a))/864e5); }
function untilText(days){
  if (days<=0) return 'jetzt';
  if (days<45) return `in ${days} Tagen`;
  const mo=Math.round(days/30.44); if (mo<24) return `in ${mo} Monaten`;
  return `in ${nfN1.format(days/365.25)} Jahren`;
}

/* ================= Krypto (WebCrypto, AES-GCM 256, PBKDF2-SHA256) ================= */
const STORE_KEY = 'vm.vault.v1';
const PREFIX = 'VMB1.';
const ITER = 600000;
const te = new TextEncoder(), td = new TextDecoder();
function b64(buf){ const u=new Uint8Array(buf); let s=''; for (let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
const ub64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter){
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function seal(key,salt,iter,obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM',iv}, key, te.encode(JSON.stringify(obj)));
  return {v:1,app:'vermietung',kdf:'PBKDF2-SHA256',iter,salt:b64(salt),iv:b64(iv),ct:b64(ct)};
}
async function unseal(key,vault){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(vault.iv)}, key, ub64(vault.ct));
  return JSON.parse(td.decode(pt));
}
const SCR = false;

}

function writeData(v){ if (SCR){ window.__VM.data=v; toScr({t:'data',d:JSON.stringify(v)}); return; } localStorage.setItem(DATA_KEY, JSON.stringify(v)); }

/* ================= Jahreswerte (Mietbeginn/-ende + Mietverlauf) ================= */
function yearRent(u,Y){
  let k=0,n=0,mo=0; const vs=[...u.verlauf].filter(v=>isISO(v.datum)).sort((a,b)=>b.datum.localeCompare(a.datum));
  for (let m=1;m<=12;m++){
    const ym=`${Y}-${String(m).padStart(2,'0')}`;
    if (isISO(u.beginn) && u.beginn.slice(0,7)>ym) continue;
    if (isISO(u.ende) && u.ende.slice(0,7)<ym) continue;
    let K=num(u.kalt); for (const v of vs){ if (v.datum.slice(0,7)>ym) K=num(v.alt); else break; }
    k+=K; n+=num(u.nk); mo++;
  }
  return {k,n,mo};
}
function instOf(u,Y){ return u.historie.filter(h=>String(h.datum).slice(0,4)===String(Y)); }

/* ================= Berechnungen (entsprechen den Excel-Formeln) ================= */
let F={}, R={};
function compute(){
  F={}; R={units:[],obj:[]};
  const put=(k,v,f='eur')=>{ F[k]={t:fmt(v,f),neg:typeof v==='number'&&v<-1e-9,n:v}; return v; };
  const today=todayISO(), iv=num(S.erh.intervall), lim=num(S.erh.limit), yr=String(S.steuerJahr);
  let TK=0,TN=0,TF=0,TU=0,TKau=0,TInst=0,moegl=0,plus=0,TKY=0,TNY=0;
  S.objekte.forEach((ob,oi)=>{
    let k=0,n=0,f=0,inst=0,ky=0,ny=0;
    ob.einheiten.forEach((u,ui)=>{
      const K=num(u.kalt), N=num(u.nk), G=K+N, A=num(u.flaeche);
      k+=K; n+=N; f+=A; TKau+=num(u.kaution);
      const p=`o${oi}u${ui}`;
      put(p+'k',K); put(p+'n',N); put(p+'g',G); put(p+'kj',K*12); put(p+'gj',G*12);
      put(p+'kqm',A?K/A:NaN,'eqm'); put(p+'wqm',A?G/A:NaN,'eqm'); put(p+'a',A,'qm');
      let next='', st='offen', days=0;
      if (isISO(u.letzteErh)){ next=edate(u.letzteErh,iv); days=daysBetween(today,next); st = days<=0 ? 'moeglich' : 'sperr'; }
      const betrag=K*lim;
      put(p+'next',next,'date'); put(p+'eb',betrag); put(p+'em',K+betrag);
      { const lr=isISO(u.letzteErh)?edate(u.letzteErh,12):'', le=isISO(u.letzteErh)?edate(u.letzteErh,15):'';
        const bd=edate(today,-36); const vs=[...u.verlauf].filter(v=>isISO(v.datum)).sort((a,b)=>b.datum.localeCompare(a.datum));
        let base=K; for (const v of vs){ if (v.datum>bd) base=num(v.alt); else break; }
        const maxK=base*1.2;
        put(p+'lr',lr,'date'); put(p+'le',le,'date'); put(p+'kb',base); put(p+'kbd',bd,'date'); put(p+'kmax',maxK); put(p+'krest',Math.max(0,maxK-K)); }
      if (st==='moeglich'){ moegl++; plus+=betrag; }
      let ui_inst=0; u.historie.forEach((h,hi)=>{ put(`${p}h${hi}`,num(h.kosten)); if (String(h.datum).slice(0,4)===yr) ui_inst+=num(h.kosten); });
      inst+=ui_inst; put(p+'inst',ui_inst);
      const yy=yearRent(u,yr); ky+=yy.k; ny+=yy.n; put(p+'ky',yy.k); put(p+'ny',yy.n); put(p+'mo',yy.mo,'n');
      R.units.push({oi,ui,ob,u,next,st,days,betrag});
    });
    let ainst=0; ob.historie.forEach(h=>{ if (String(h.datum).slice(0,4)===yr) ainst+=num(h.kosten); }); inst+=ainst; put(`o${oi}ainst`,ainst);
    TK+=k; TN+=n; TKY+=ky; TNY+=ny; put(`o${oi}ky`,ky); put(`o${oi}ny`,ny); TF+=f; TU+=ob.einheiten.length; TInst+=inst;
    R.obj.push({k,n,f,inst});
    put(`o${oi}k`,k); put(`o${oi}n`,n); put(`o${oi}g`,k+n); put(`o${oi}kj`,k*12); put(`o${oi}nj`,n*12); put(`o${oi}gj`,(k+n)*12);
    put(`o${oi}f`,f,'qm'); put(`o${oi}kqm`,f?k/f:NaN,'eqm'); put(`o${oi}inst`,inst);
  });
  R.TK=TK; R.moegl=moegl; put('tky',TKY); put('tny',TNY); put('tgy',TKY+TNY);
  const nx=R.units.filter(x=>x.st==='sperr').sort((a,b)=>a.next.localeCompare(b.next))[0]; R.nextErh=nx||null;
  put('tk',TK); put('tn',TN); put('tg',TK+TN); put('tkj',TK*12); put('tnj',TN*12); put('tgj',(TK+TN)*12);
  put('tf',TF,'qm'); put('tu',TU,'n'); put('tkqm',TF?TK/TF:NaN,'eqm'); put('tg0',TK+TN,'eur0'); put('tn0',TN,'eur0'); put('tkqm0',TF?TK/TF:NaN,'eur'); put('tkau',TKau); put('tinst',TInst);
  put('moegl',moegl,'n'); put('plus',plus); put('plusj',plus*12);
  put('limit',lim,'pct');
}

function findUnit(id){ for (let oi=0;oi<S.objekte.length;oi++){ const ui=S.objekte[oi].einheiten.findIndex(u=>u.id===id); if(ui>=0) return [oi,ui]; } return [-1,-1]; }

function push(next){ UI.stack.push({obj:UI.obj,unit:UI.unit}); Object.assign(UI,{obj:null,unit:null,confirm:null,erh:null},next); render(); $('#view').scrollTop=0; }
function back(){ const p=UI.stack.pop()||{obj:null,unit:null}; UI.obj=p.obj; UI.unit=p.unit; UI.confirm=null; UI.erh=null;
  if (UI.unit && findUnit(UI.unit)[0]<0) UI.unit=null; if (UI.obj && findObj(UI.obj)<0) UI.obj=null; render(); $('#view').scrollTop=0; }
function backLabel(){
  const p=UI.stack[UI.stack.length-1]; if(!p) return 'Zurück';
  if (p.unit){ const [oi,ui]=findUnit(p.unit); return oi>=0?(S.objekte[oi].einheiten[ui].lage||'Einheit'):'Zurück'; }
  if (p.obj){ const i=findObj(p.obj); return i>=0?S.objekte[i].name:'Zurück'; }
  return (TABS.find(t=>t[0]===UI.tab)||[])[1]||'Zurück';
}

/* ================= Steuerberater-Export ================= */
function stbRows(){
  const Y=S.steuerJahr;
  const E=withErh();
  const rows=[['Objekt','Wohnung','Größe (m²)','Kaltmiete / Monat (aktuell)',`Mieteinnahmen ${Y}`].concat(E?[`Erhaltungsaufwendungen ${Y}`]:[])];
  S.objekte.forEach(ob=>ob.einheiten.forEach(u=>{
    const y=yearRent(u,Y), inst=instOf(u,Y).reduce((a,h)=>a+num(h.kosten),0);
    rows.push([ob.name,u.lage,num(u.flaeche),num(u.kalt),y.k].concat(E?[inst]:[]));
  }));
  rows.push(['Gesamt','','','',S.objekte.reduce((a,ob)=>a+ob.einheiten.reduce((s,u)=>s+yearRent(u,Y).k,0),0)].concat(E?[allCosts().filter(c=>String(c.h.datum).slice(0,4)===String(Y)).reduce((a,c)=>a+num(c.h.kosten),0)]:[]));
  if (!E) return rows;
  rows.push([]);
  S.objekte.forEach(ob=>{ const a=instOf(ob,Y).reduce((s,h)=>s+num(h.kosten),0); if (a) rows.push([ob.name,'Allgemein','','','',a]); });
  rows.push([]); rows.push(['Datum','Objekt','Wohnung','Gewerk','Leistung','Firma','Rechnungs-Nr.','Betrag']);
  allCosts().filter(c=>String(c.h.datum).slice(0,4)===String(Y)).sort((a,b)=>String(a.h.datum).localeCompare(String(b.h.datum))).forEach(c=>rows.push([fmtDate(c.h.datum),c.ob.name,c.where,c.h.gewerk,c.h.massnahme,c.h.firma,c.h.rechnung,num(c.h.kosten)]));
  return rows;
}
function stbText(){
  compute(); const Y=S.steuerJahr; let t=`Mieteinnahmen ${Y}\n`;
  S.objekte.forEach((ob,oi)=>{
    t+=`\n${ob.name}${ob.ort?' ('+ob.ort+')':''}\n`;
    t+=`  ${AV_LBL.miete}: ${F[`o${oi}ky`].t}\n`;
    ob.einheiten.forEach((u,ui)=>{ t+=`    ${u.lage||'Einheit'} (${nfN1.format(num(u.flaeche))} m²): ${F[`o${oi}u${ui}ky`].t}\n`; });
    if (!withErh()) return;
    t+=`  ${AV_LBL.erh}: ${F[`o${oi}inst`].t}\n`;
    const hs=[...instOf(ob,Y).map(h=>['Allgemein',h])]; ob.einheiten.forEach(u=>instOf(u,Y).forEach(h=>hs.push([u.lage||'Einheit',h])));
    hs.sort((a,b)=>String(a[1].datum).localeCompare(String(b[1].datum))).forEach(([w,h])=>{ t+=`    ${fmtDate(h.datum)} ${w}: ${h.massnahme||h.gewerk||'Rechnung'}${h.firma?' – '+h.firma:''}: ${fmt(num(h.kosten),'eur')}\n`; });
  });
  t+=`\nGesamt (alle Objekte)\n  ${AV_LBL.miete}: ${F.tky.t}\n`;
  if (withErh()) t+=`  ${AV_LBL.erh}: ${F.tinst.t}\n`;
  return t;
}

function buildPdf(){
  compute();
  const Y=S.steuerJahr, W=595.28, H=841.89, M=46, today=fmtDate(todayISO());
  const C={ink:'0.08 0.10 0.13',muted:'0.40 0.44 0.49',line:'0.84 0.86 0.89',acc:'0.17 0.36 0.54',soft:'0.94 0.96 0.98',white:'1 1 1'};
  const pages=[]; let ops, y;
  const f2=v=>v.toFixed(2);
  const T=(s,x,yy,o={})=>{ const sz=o.size||9.5, b=!!o.bold; let t=String(s); if (o.max){ while(t.length>1 && tw(t,b,sz)>o.max) t=t.slice(0,-1); if (t!==String(s)) t=t.slice(0,-1)+'…'; }
    const w=tw(t,b,sz); const xx=o.align==='right'?x-w:o.align==='center'?x-w/2:x;
    ops.push(`BT /${b?'F2':'F1'} ${sz} Tf ${o.color||C.ink} rg ${f2(xx)} ${f2(yy)} Td ${ps(t)} Tj ET`); };
  const Rf=(x,yy,w,h,c)=>ops.push(`${c} rg ${f2(x)} ${f2(yy)} ${f2(w)} ${f2(h)} re f`);
  const L=(x1,y1,x2,y2,c=C.line,w=0.6)=>ops.push(`${c} RG ${w} w ${f2(x1)} ${f2(y1)} m ${f2(x2)} ${f2(y2)} l S`);

  const page=()=>{ ops=[]; pages.push(ops); y=H-M; };
  const need=h=>{ if (y-h<M+28){ page(); T(`${cur} – Mieteinnahmen ${Y} (Fortsetzung)`,M,y-4,{size:9,color:C.muted}); y-=24; } };
  const e=v=>fmt(v,'eur');

  const cols=[{h:'Wohnung',x:M+8,a:'left',max:170},{h:'Fläche',x:M+250},{h:'Kaltmiete / Monat',x:M+380},{h:'Kaltmiete '+Y,x:W-M-8}];
  const head=(cs)=>{ Rf(M,y-18,W-2*M,18,C.soft); cs.forEach(c=>T(c.h,c.x,y-12.5,{size:8,bold:true,color:C.muted,align:c.a||'right'})); y-=18; };
  const row=(cs,vals,o={})=>{ cs.forEach((c,i)=>T(vals[i],c.x,y-13,{size:9.5,bold:!!o.bold,align:c.a||'right',max:c.max})); y-=19; L(M,y,W-M,y,o.bold?C.ink:C.line,o.bold?0.8:0.5); };
  let cur='';

  S.objekte.forEach((ob,oi)=>{
    cur=ob.name; page();
    // Kopf je Objekt
    Rf(M,y-3,4,30,C.acc);
    T(ob.name,M+14,y+8,{size:20,bold:true,max:W-2*M-110});
    T(`Mieteinnahmen ${Y}`,W-M,y+10,{size:10,bold:true,color:C.muted,align:'right'});
    const sub=[ob.typ,ob.ort].filter(Boolean).join(' · '); if (sub) T(sub,M+14,y-8,{size:9.5,color:C.muted});
    y-=36;
    // Kennzahlen dieses Objekts
    const E=withErh(), tiles=[[AV_LBL.miete,F[`o${oi}ky`].n]].concat(E?[[AV_LBL.erh,F[`o${oi}inst`].n]]:[]);
    const bw=(W-2*M-8)/2;
    tiles.forEach(([l,v],i)=>{ const x=M+i*(bw+8);
      Rf(x,y-46,bw,46,C.soft); T(l,x+10,y-15,{size:8,color:C.muted,max:bw-16}); T(e(v),x+10,y-34,{size:14,bold:true,max:bw-16}); });
    y-=68;
    T('Mieteinnahmen',M,y-10,{size:10,bold:true}); y-=16;
    head(cols);
    ob.einheiten.forEach((u,ui)=>{ need(22); const p=`o${oi}u${ui}`;
      row(cols,[u.lage||'Einheit',nfN1.format(num(u.flaeche))+' qm',e(num(u.kalt)),e(F[p+'ky'].n)]); });
    need(22);
    row(cols,['Summe',nfN1.format(R.obj[oi].f)+' qm',e(R.obj[oi].k),e(F[`o${oi}ky`].n)],{bold:true});
    if (!E) return;
    // Erhaltungsaufwendungen
    const hs=[]; instOf(ob,Y).forEach(h=>hs.push([{lage:'Allgemein'},h])); ob.einheiten.forEach(u=>instOf(u,Y).forEach(h=>hs.push([u,h])));
    y-=16; need(60);
    T(`Erhaltungsaufwendungen ${Y}`,M,y-10,{size:10,bold:true}); y-=16;
    const ic=[{h:'Datum',x:M+8,a:'left'},{h:'Wohnung',x:M+72,a:'left',max:70},{h:'Leistung',x:M+148,a:'left',max:160},{h:'Firma',x:M+316,a:'left',max:78},{h:'Rechn.-Nr.',x:M+402,a:'left',max:52},{h:'Betrag',x:W-M-8}];
    head(ic);
    if (!hs.length) row(ic,['Keine Erhaltungsaufwendungen erfasst','','','','',e(0)]);
    hs.sort((a,b)=>String(a[1].datum).localeCompare(String(b[1].datum))).forEach(([u,h])=>{ need(22); row(ic,[fmtDate(h.datum),u.lage||'',[h.massnahme,h.gewerk&&h.massnahme?'('+h.gewerk+')':h.gewerk].filter(Boolean).join(' ')||'–',h.firma||'',h.rechnung||'',e(num(h.kosten))]); });
    need(22); row(ic,['Summe','','','','',e(F[`o${oi}inst`].n)],{bold:true});
  });
  if (!pages.length){ cur=''; page(); T('Keine Objekte erfasst.',M,y-12,{size:11}); }
  else {
    const E=withErh(); cur='Gesamt'; page();
    Rf(M,y-3,4,30,C.acc);
    T('Gesamt',M+14,y+8,{size:20,bold:true});
    T(`Mieteinnahmen ${Y}`,W-M,y+10,{size:10,bold:true,color:C.muted,align:'right'});
    T('Alle Objekte',M+14,y-8,{size:9.5,color:C.muted});
    y-=36;
    const bw=(W-2*M-8)/2;
    [[AV_LBL.miete,F.tky.n]].concat(E?[[AV_LBL.erh,F.tinst.n]]:[]).forEach(([l,v],i)=>{ const x=M+i*(bw+8);
      Rf(x,y-46,bw,46,C.soft); T(l,x+10,y-15,{size:8,color:C.muted,max:bw-16}); T(e(v),x+10,y-34,{size:14,bold:true,max:bw-16}); });
    y-=68;
    const gc=E?[{h:'Objekt',x:M+8,a:'left',max:230},{h:AV_LBL.miete,x:M+360},{h:AV_LBL.erh,x:W-M-8}]
              :[{h:'Objekt',x:M+8,a:'left',max:300},{h:AV_LBL.miete,x:W-M-8}];
    head(gc);
    S.objekte.forEach((ob,oi)=>{ need(22); row(gc,[ob.name+(ob.ort?' ('+ob.ort+')':''),e(F[`o${oi}ky`].n)].concat(E?[e(F[`o${oi}inst`].n)]:[])); });
    need(22); row(gc,['Summe',e(F.tky.n)].concat(E?[e(F.tinst.n)]:[]),{bold:true});
  }

  // Fußzeile
  pages.forEach((o,i)=>{ ops=o; L(M,M,W-M,M,C.line,0.5); T(`Vermietung · erstellt am ${today}`,M,M-13,{size:8,color:C.muted}); T(`Seite ${i+1} von ${pages.length}`,W-M,M-13,{size:8,color:C.muted,align:'right'}); });

  // Datei zusammensetzen
  const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
  add('<< /Type /Catalog /Pages 2 0 R >>'); add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];
  pages.forEach(o=>{ const c=o.join('\n'); const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${ci} 0 R >>`)); });
  objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+' 0 R').join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n'; const offs=[];
  objs.forEach((s,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${s}\nendobj\n`; });
  const xr=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(x=>String(x).padStart(10,'0')+' 00000 n \n').join('');
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info << /Title ${ps('Mieteinnahmen '+Y)} /Producer (Vermietung) >> >>\nstartxref\n${xr}\n%%EOF`;
  return out;
}

    case 'einheit': { const u=unit({lage:'Neue Einheit'}); setTimeout(()=>push({unit:u.id}),0); return u; }

  else if (a==='clearNotice'){ UI.notice=''; render(); }

  else if (a==='stbCopy') stbCopy();
  else if (a==='stbCsv') stbCsv();

  else if (a==='backup') makeBackup();

  else if (a==='copyBackup') copyBackup();

  else if (a==='wipe') wipe();
  else if (WEBACT[a]) WEBACT[a](b);
}

/* ================= Web-Version: Speichern, Schlüssel, Entsperren (wie Finanzplanung Web) ================= */
/* Aufbau:
   - Die Daten werden mit einem zufälligen Datenschlüssel (DEK, AES-256-GCM) verschlüsselt.
   - Der DEK liegt nur "eingepackt" im Tresor, mit mehreren Schlössern:
       rec  = Wiederherstellungscode (immer vorhanden, zum Aufschreiben)
       prf  = Face ID / Fingerabdruck über einen Passkey (WebAuthn-PRF)
       gate = Passkey ohne PRF: Face ID muss bestätigt werden, dann öffnet der Geräteschlüssel
       dev  = Geräteschlüssel (nicht exportierbar, IndexedDB)
   - Fällt ein Schloss aus, öffnet ein anderes. Der Code allein reicht immer. */
const WEBVER = '1';
const WEB_KEY = 'vm.web.v3';
let DEKRAW = null, LOCKS = null, CUR_VAULT = null, PENDING = null, hiddenAt = 0;
const RC_ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const fmtCode = c => c.match(/.{1,4}/g).join('-');
const normCode = s => String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function newRecoveryCode(){ const b=rnd(24); let s=''; for (const x of b) s+=RC_ALPHA[x&31]; return s; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- Speichern ---- */
function setStatus(busy,text){ const s=$('#saveStatus'); if(!s) return; s.classList.toggle('busy',busy); s.lastChild.textContent=text; }
function scheduleSave(){ setStatus(true,'Speichert …'); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,500); }

/* ---- Hilfen ---- */
async function aesKey(raw, usages=['encrypt','decrypt']){ return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, usages); }
async function wrapWith(kek, raw){ const iv=rnd(12); const w=await crypto.subtle.encrypt({name:'AES-GCM',iv}, kek, raw); return {iv:b64(iv), w:b64(w)}; }
async function unwrapWith(kek, lock){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(lock.iv)}, kek, ub64(lock.w))); }
async function kekFromCode(code, saltB64, iter){
  const base = await crypto.subtle.importKey('raw', te.encode(normCode(code)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:ub64(saltB64), iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}
async function kekFromPrf(prfOut){
  const base = await crypto.subtle.importKey('raw', prfOut, 'HKDF', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF', hash:'SHA-256', salt:new Uint8Array(32), info:te.encode('vermietung-v3')}, base, {name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
}

/* ---- Geräteschlüssel (nicht exportierbar, IndexedDB) ---- */
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open('vermietung',1); r.onupgradeneeded=()=>r.result.createObjectStore('keys'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('keys').objectStore('keys').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction('keys','readwrite'); t.objectStore('keys').put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbDel(k){ try { const db=await idb(); await new Promise(res=>{ const t=db.transaction('keys','readwrite'); t.objectStore('keys').delete(k); t.oncomplete=res; t.onerror=res; }); } catch(e){} }
async function deviceKeyGet(create){
  try { const k=await idbGet('dev'); if (k) return k; } catch(e){}
  if (!create) return null;
  const k = await crypto.subtle.generateKey({name:'AES-GCM',length:256}, false, ['encrypt','decrypt']);
  try { await idbSet('dev',k); } catch(e){ return null; }
  return k;
}

/* ---- Passkey (Face ID / Fingerabdruck) ---- */
const passkeyAvailable = async () => { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e){ return false; } };
async function passkeyCreate(prfSalt){
  const cred = await navigator.credentials.create({publicKey:{
    rp:{name:'Vermietung', id:location.hostname},
    user:{id:rnd(16), name:'Vermietung', displayName:'Vermietung'},
    challenge:rnd(32),
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{residentKey:'required', requireResidentKey:true, userVerification:'required', authenticatorAttachment:'platform'},
    extensions:{prf:{eval:{first:prfSalt}}},
    timeout:120000
  }});
  const ext = cred.getClientExtensionResults ? cred.getClientExtensionResults() : {};
  return {id:b64(cred.rawId), prfEnabled: !!(ext.prf && ext.prf.enabled), prfFirst: ext.prf && ext.prf.results && ext.prf.results.first ? new Uint8Array(ext.prf.results.first) : null};
}
async function passkeyGet(credB64, prfSalt){
  const opts = {challenge:rnd(32), userVerification:'required', timeout:120000, rpId:location.hostname};
  if (credB64) opts.allowCredentials=[{type:'public-key', id:ub64(credB64)}];
  if (prfSalt) opts.extensions={prf:{eval:{first:prfSalt}}};
  const a = await navigator.credentials.get({publicKey:opts});
  const ext = a.getClientExtensionResults ? a.getClientExtensionResults() : {};
  return {id:b64(a.rawId), prfFirst: ext.prf && ext.prf.results && ext.prf.results.first ? new Uint8Array(ext.prf.results.first) : null};
}

/* ---- Tresor lesen/schreiben ---- */
async function sealV3(data){
  const iv=rnd(12);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv}, KEY, te.encode(JSON.stringify(data)));
  return {v:3, app:'vermietung', iv:b64(iv), ct:b64(ct), locks:LOCKS, updated:Date.now()};
}
async function openV3(raw, v){ const k=await aesKey(raw); const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(v.iv)}, k, ub64(v.ct)); return {k, data:JSON.parse(td.decode(pt))}; }
function writeV3(v){ CUR_VAULT = JSON.stringify(v); localStorage.setItem(WEB_KEY, CUR_VAULT); }
function saveNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if (!KEY||!S) return saving;
  const data=JSON.parse(JSON.stringify(S));
  saving = saving.then(async()=>{
    try { writeV3(await sealV3(data)); setStatus(false,'Verschlüsselt gespeichert'); }
    catch(err){ setStatus(true,'Speichern fehlgeschlagen. Bitte Sicherung speichern'); }
  });
  return saving;
}

/* ---- Teilen / Speichern in Dateien ---- */
function downloadBlob(blob,name){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500); }catch(e){} }
function shareOrDownload(blob,name){
  try {
    const file = new File([blob], name, {type: blob.type || 'application/octet-stream'});
    if (navigator.canShare && navigator.canShare({files:[file]})) return navigator.share({files:[file], title:name}).then(()=>true, e=> e && e.name==='AbortError' ? false : (downloadBlob(blob,name), true));
  } catch(e){}
  downloadBlob(blob,name); return Promise.resolve(true);
}

/* ---- Bildschirme vor dem Öffnen ---- */
const LK = { set(msg, html, err=''){ $('#app').hidden=true; $('#lock').hidden=false; $('#lockMsg').innerHTML=msg; $('#lkBody').innerHTML=html||''; $('#lkErr').textContent=err; } };
const lkBtn = (id,label,cls='primary') => `<button id="${id}" class="btn ${cls}" type="button">${label}</button>`;
const lkLink = (id,label,style='') => `<button id="${id}" class="link" type="button" style="${style}">${label}</button>`;
function on(id,fn){ const el=document.getElementById(id); if (el) el.addEventListener('click',fn); }

function showWelcome(note){
  LK.set(note ? esc(note) : 'Deine Vermietung, verschlüsselt auf diesem Gerät. Du entsperrst mit Face ID, und ein Wiederherstellungscode sichert dich ab.',

/* Einrichtung: 1) Code zeigen, 2) Code bestätigen, 3) Face ID */
let SETUP=null;
async function setupStart(){
  DEKRAW = rnd(32);
  const code=newRecoveryCode(), salt=b64(rnd(16)), iter=150000;
  LOCKS = {rec:{salt, iter, ...(await wrapWith(await kekFromCode(code,salt,iter), DEKRAW))}};
  SETUP = {code};
  LK.set('<b>Dein Wiederherstellungscode.</b> Schreib ihn auf oder speichere ihn in einer gesperrten Notiz. Ohne Face ID kommst du nur damit an deine Daten.',
    `<div class="rcode" id="rcode">${fmtCode(code)}</div>
     ${lkBtn('rcCopy','Code kopieren','')}
     <label class="sr" for="rcCheck">Letzte 4 Zeichen</label>
     <input id="rcCheck" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="4" placeholder="Zur Kontrolle: die letzten 4 Zeichen">
     ${lkBtn('rcNext','Weiter')}`);
  on('rcCopy', ()=>{ navigator.clipboard && navigator.clipboard.writeText(fmtCode(code)).then(()=>{ $('#rcCopy').textContent='Kopiert'; },()=>{}); });
  on('rcNext', ()=>{
    if (normCode($('#rcCheck').value)!==code.slice(-4)){ $('#lkErr').textContent='Die letzten 4 Zeichen stimmen nicht. Schau noch einmal auf den Code.'; return; }
    setupFaceId();
  });
}
async function setupFaceId(){
  const avail = await passkeyAvailable();
  if (!avail){ return setupFinish('none'); }
  LK.set('<b>Face ID einrichten.</b> Damit öffnest du die App künftig mit einem Blick. Dein iPhone legt dafür einen Passkey an, der im iCloud-Schlüsselbund gesichert wird.',
    lkBtn('fiGo','Face ID einrichten')+lkLink('fiSkip','Ohne Face ID weiter'));
  on('fiGo', faceIdCreate);
  on('fiSkip', ()=>setupFinish('none'));
}
async function faceIdCreate(){
  $('#lkErr').textContent='';
  const prfSalt = rnd(32);
  let c;
  try { c = await passkeyCreate(prfSalt); }
  catch(e){ $('#lkErr').textContent='Face ID wurde nicht eingerichtet ('+(e&&e.name||'Fehler')+'). Du kannst es nochmal versuchen oder ohne Face ID weitermachen.'; return; }
  if (c.prfFirst) return addPrfLock(c.id, prfSalt, c.prfFirst);
  LK.set('<b>Fast fertig.</b> Bestätige Face ID noch einmal, damit dein Schlüssel daraus erzeugt werden kann.',
    lkBtn('fiConfirm','Face ID bestätigen')+lkLink('fiSkip2','Überspringen'));
  on('fiConfirm', async ()=>{
    $('#lkErr').textContent='';
    try {
      const g = await passkeyGet(c.id, prfSalt);
      if (g.prfFirst) return addPrfLock(c.id, prfSalt, g.prfFirst);
      return addGateLock(c.id);
    } catch(e){ $('#lkErr').textContent='Das hat nicht geklappt ('+(e&&e.name||'Fehler')+'). Versuch es nochmal.'; }
  });
  on('fiSkip2', ()=>addGateLock(c.id));
}
async function addPrfLock(credId, prfSalt, prfOut){
  LOCKS.prf = {cred:credId, salt:b64(prfSalt), ...(await wrapWith(await kekFromPrf(prfOut), DEKRAW))};
  delete LOCKS.gate; delete LOCKS.dev;
  return SETUP ? setupFinish('prf') : afterLockChange('Face ID ist eingerichtet.');
}
async function addGateLock(credId){
  const dk = await deviceKeyGet(true);
  if (!dk){ return SETUP ? setupFinish('none') : afterLockChange('Face ID ließ sich auf diesem Gerät nicht einrichten.'); }
  LOCKS.gate = {cred:credId}; LOCKS.dev = await wrapWith(dk, DEKRAW);
  return SETUP ? setupFinish('gate') : afterLockChange('Face ID ist als Sperre eingerichtet.');
}
async function setupFinish(kind){
  if (kind==='none'){ const dk=await deviceKeyGet(true); if (dk){ LOCKS.dev = await wrapWith(dk, DEKRAW); } }
  KEY = await aesKey(DEKRAW);
  S = normalize(defaults()); S.beispiel = true; S.settings.lastBackup = 0;
  SETUP = null;
  await saveNow(); openApp();
  UI.notice = kind==='prf' ? 'Fertig. Ab jetzt öffnest du die App mit Face ID. Importiere jetzt deine Daten unter Daten (oben rechts).'
    : kind==='gate' ? 'Fertig. Face ID schützt die App. Importiere jetzt deine Daten unter Daten (oben rechts).'
    : 'Fertig. Die App öffnet sich auf diesem Gerät direkt. Importiere jetzt deine Daten unter Daten (oben rechts).';
  render();
}
async function afterLockChange(msg){ UI.fid=null; await saveNow(); UI.notice=msg; render(); }

/* Entsperren */
function showUnlock(v, why){
  const hasFace = !!(v.locks && (v.locks.prf || v.locks.gate));
  LK.set(why || (hasFace ? 'Entsperre mit Face ID.' : 'Gib deinen Wiederherstellungscode ein.'),
    (hasFace ? lkBtn('ulFace','Mit Face ID entsperren') : '') +
    `<div id="ulCodeBox" ${hasFace?'hidden':''} class="lkcol"><label class="sr" for="ulCode">Wiederherstellungscode</label><input id="ulCode" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">${lkBtn('ulCodeGo','Mit Code öffnen')}</div>` +
    (hasFace ? lkLink('ulCodeShow','Mit Wiederherstellungscode öffnen') : '') +
    (PENDING ? lkLink('ulCancel','Abbrechen') : ''));
  on('ulFace', ()=>unlockFace(v));
  on('ulCodeShow', ()=>{ $('#ulCodeBox').hidden=false; $('#ulCodeShow').hidden=true; $('#ulCode').focus(); });
  on('ulCodeGo', ()=>unlockCode(v));
  on('ulCancel', ()=>{ PENDING=null; boot(); });
  const ci=$('#ulCode'); if (ci) ci.addEventListener('keydown',e=>{ if(e.key==='Enter') unlockCode(v); });
}
async function finishUnlock(v, raw, data, note){
  DEKRAW = raw; LOCKS = v.locks || {}; KEY = await aesKey(DEKRAW);
  try { S = normalize(data); } catch(e){ S = data; }
  if (LOCKS.gate || (!LOCKS.prf && !LOCKS.gate)){ const dk=await deviceKeyGet(true); if (dk) LOCKS.dev = await wrapWith(dk, DEKRAW); }
  const wasPending = !!PENDING; PENDING=null;
  await saveNow(); openApp();
  if (note || wasPending){ UI.notice = note || 'Sicherung wiederhergestellt.'; render(); }
}
async function unlockFace(v){
  $('#lkErr').textContent='';
  try {
    if (v.locks.prf){
      const g = await passkeyGet(v.locks.prf.cred, ub64(v.locks.prf.salt));
      if (!g.prfFirst) throw new Error('noprf');
      const raw = await unwrapWith(await kekFromPrf(g.prfFirst), v.locks.prf);
      const {data} = await openV3(raw, v); return finishUnlock(v, raw, data);
    }
    if (v.locks.gate){
      await passkeyGet(v.locks.gate.cred, null);
      const dk = await deviceKeyGet(false);
      if (!dk || !v.locks.dev) throw new Error('nodev');
      const raw = await unwrapWith(dk, v.locks.dev);
      const {data} = await openV3(raw, v); return finishUnlock(v, raw, data);
    }
  } catch(e){
    const n = e && (e.name||e.message);
    $('#lkErr').textContent = n==='NotAllowedError' ? 'Face ID wurde abgebrochen. Tipp nochmal auf den Knopf.'
      : 'Face ID hat hier nicht geklappt. Öffne die App mit deinem Wiederherstellungscode.';
    $('#ulCodeBox').hidden=false; const s=$('#ulCodeShow'); if (s) s.hidden=true;
  }
}
let codeFails=0;
async function unlockCode(v){
  $('#lkErr').textContent='';
  const code=normCode($('#ulCode').value);
  if (code.length!==24){ $('#lkErr').textContent='Der Code hat 24 Zeichen (ohne Bindestriche).'; return; }
  if (codeFails>2) await sleep(Math.min(20000, 1000*2**(codeFails-3)));
  try {
    const r=v.locks.rec; const raw=await unwrapWith(await kekFromCode(code, r.salt, r.iter||150000), r);
    const {data}=await openV3(raw, v); codeFails=0; return finishUnlock(v, raw, data);
  } catch(e){ codeFails++; $('#lkErr').textContent='Der Code passt nicht zu diesen Daten.'; }
}
async function unlockDevice(v){
  try {
    const dk=await deviceKeyGet(false); if (!dk || !v.locks.dev) throw 0;
    const raw=await unwrapWith(dk, v.locks.dev); const {data}=await openV3(raw, v); return finishUnlock(v, raw, data);
  } catch(e){ showUnlock(v, 'Gib deinen Wiederherstellungscode ein, um die Daten auf diesem Gerät zu öffnen.'); }
}

/* Sicherung als Datei */
async function readBackupFile(f){
  if (!f) return;
  $('#lkErr').textContent='';
  try {
    const txt=(await f.text()).trim(); const v=JSON.parse(txt);
    if (!v || v.v!==3 || v.app!=='vermietung' || !v.locks || !v.locks.rec) throw 0;
    PENDING=v; showUnlock(v, 'Sicherung gefunden. Öffne sie mit Face ID oder dem Wiederherstellungscode, der zu dieser Sicherung gehört.');
  } catch(e){ $('#lkErr').textContent='Diese Datei ist keine Sicherung dieser App. Deine Excel-Daten (.json) importierst du nach dem Einrichten unter Daten.'; }
}
function saveSicherung(){
  if (!CUR_VAULT){ UI.notice='Es gibt noch nichts zu sichern.'; render(); return; }
  const name=`Vermietung-Sicherung-${todayISO()}.json`;
  shareOrDownload(new Blob([CUR_VAULT],{type:'application/json'}), name).then(ok=>{
    if (!ok) return;
    S.settings.lastBackup=Date.now(); scheduleSave();
    UI.notice='Sicherung erstellt. Bewahre die Datei in der Dateien-App auf, am besten in iCloud Drive.'; render();
  });
}
const makeBackup = saveSicherung, saveBackupFile = saveSicherung;
function copyBackup(){}
function backupBanner(){
  const lb=num(S.settings.lastBackup||0), days=lb?Math.floor((Date.now()-lb)/86400000):null;
  if (lb && days<7) return '';
  return `<div class="note warn" style="margin:0 0 12px"><span>${lb ? `Deine letzte Sicherung ist ${days} Tage alt. Sichere deine Daten in der Dateien-App.` : 'Du hast noch keine Sicherung in Dateien. Ohne Sicherung sind die Daten weg, wenn das Gerät verloren geht.'}</span><button class="btn small" type="button" data-act="backupFile">Jetzt sichern</button></div>`;
}

/* Import (Excel-Datendatei, alte Scriptable-Backups) */
$('#view').addEventListener('change', async e=>{
  if (e.target.id==='impFile'){ const f=e.target.files[0]; if(f) $('#impText').value=(await f.text()).trim(); }
  if (e.target.id==='restoreIn'){ const f=e.target.files[0]; if(f) inAppRestore(f); }
});
async function inAppRestore(f){
  try {
    const v=JSON.parse((await f.text()).trim());
    if (!v || v.v!==3 || v.app!=='vermietung') throw new Error('Das ist keine Sicherung dieser App.');
    try { const {data}=await openV3(DEKRAW, v); S=normalize(data); await saveNow(); UI.notice='Sicherung wiederhergestellt.'; render(); return; } catch(x){}
    throw new Error('Diese Sicherung gehört zu einer anderen Einrichtung. Lösche unter „Alle Daten löschen“ die aktuellen Daten und stell sie beim Einrichten über „Sicherung wiederherstellen“ mit ihrem Code her.');
  } catch(e){ UI.importErr=e.message||'Wiederherstellen fehlgeschlagen.'; render(); }
}
async function doImport(){
  UI.importErr=UI.importMsg='';
  const txt=($('#impText').value||'').trim(), pw=$('#impPw')?$('#impPw').value:'';
  try{
    if (!txt) throw new Error('Wähle zuerst eine Datei oder füge den Text ein.');
    if (!txt.startsWith(PREFIX)){ let o=null; try{ o=JSON.parse(txt); }catch(x){} if (o && o.v===3) throw new Error('Das ist eine Sicherung. Nutze dafür „Sicherung öffnen“ weiter oben.'); }
    const data=await decodeImport(txt,pw);
    const plain=!txt.startsWith(PREFIX) && !/"ct"\s*:/.test(txt);
    const keep=S.settings.lastBackup;
    S=normalize(data); S.beispiel=false; S.settings.lastBackup=keep||0; await saveNow();
    UI.importMsg = plain ? 'Importiert und verschlüsselt gespeichert. Lösche die unverschlüsselte Importdatei jetzt von deinem Gerät.' : 'Backup importiert.';
  } catch(x){ UI.importErr=x.message||'Import fehlgeschlagen.'; }
  render();
}
// Backup (VMB1), alte verschlüsselte Datei (vault.json) oder unverschlüsselte Datendatei
async function decodeImport(txt,pw){
  if (!txt) throw new Error('Füge zuerst ein Backup oder eine Datendatei ein.');
  let v=null;
  if (txt.startsWith(PREFIX)) v=JSON.parse(td.decode(ub64(txt.slice(PREFIX.length))));
  else {
    let o; try{ o=JSON.parse(txt); } catch(x){ throw new Error('Der Text ist weder ein Backup noch gültiges JSON.'); }
    if (o && o.ct && o.salt) v=o;
    else { if (!o || !Array.isArray(o.objekte)) throw new Error('Die Datei enthält keine Vermietungs-Daten.'); return o; }
  }
  const key=await deriveKey(pw,ub64(v.salt),v.iter||ITER);
  try{ return await unseal(key,v); } catch(x){ throw new Error('Das Passwort passt nicht zu diesem Backup.'); }
}
async function wipe(){
  if (($('#wipeIn').value||'').trim().toUpperCase()!=='LÖSCHEN'){ $('#wipeIn').focus(); return; }
  clearTimeout(saveTimer); saveTimer=null; await saving;
  try { localStorage.removeItem(WEB_KEY); } catch(e){}
  await idbDel('dev');
  KEY=null; S=null; DEKRAW=null; LOCKS=null; CUR_VAULT=null; UI.tab='uebersicht'; UI.obj=UI.unit=null; UI.stack=[];
  showWelcome('Alle Daten wurden von diesem Gerät gelöscht.');
}

/* Einstellungen: Face ID nachträglich, neuer Code */
const WEBACT = {
  setupFaceId(){ faceIdInApp(); },
  newRecovery(){ newRecoveryInApp(); },
  recDone(){ UI.newCode=null; render(); },
  restoreOpen(){ const i=$('#restoreIn'); if (i) i.click(); },
  async fidConfirm(){
    const f=UI.fid; if(!f) return;
    try { const g=await passkeyGet(f.id, f.salt); UI.fid=null; if (g.prfFirst) return addPrfLock(f.id, f.salt, g.prfFirst); return addGateLock(f.id); }
    catch(e){ UI.fidErr='Das hat nicht geklappt ('+(e&&e.name||'Fehler')+').'; render(); }
  },
};
async function faceIdInApp(){
  UI.fidErr='';
  const prfSalt=rnd(32);
  try {
    const c = await passkeyCreate(prfSalt);
    if (c.prfFirst) return addPrfLock(c.id, prfSalt, c.prfFirst);
    UI.fid = {id:c.id, salt:prfSalt}; render();
  } catch(e){ UI.fidErr='Face ID wurde nicht eingerichtet ('+(e&&e.name||'Fehler')+').'; render(); }
}
async function newRecoveryInApp(){
  const code=newRecoveryCode(), salt=b64(rnd(16)), iter=150000;
  LOCKS.rec = {salt, iter, ...(await wrapWith(await kekFromCode(code,salt,iter), DEKRAW))};
  await saveNow(); UI.newCode=code; render();
}

/* Öffnen der App */
function openApp(){
  $('#lock').hidden=true; $('#app').hidden=false;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
  if (UI.unit && findUnit(UI.unit)[0]<0) { UI.unit=null; UI.stack=[]; }
  if (UI.obj && findObj(UI.obj)<0) { UI.obj=null; UI.stack=[]; }
  render(); $('#view').scrollTop=0;
}

/* Sperren, wenn die App länger im Hintergrund war (nur mit Face ID) */
document.addEventListener('visibilitychange',()=>{
  if (document.hidden){ hiddenAt=Date.now(); if (saveTimer) saveNow(); return; }
  if (S && LOCKS && (LOCKS.prf||LOCKS.gate) && hiddenAt && Date.now()-hiddenAt>60000){
    const v = CUR_VAULT ? JSON.parse(CUR_VAULT) : null;
    KEY=null; S=null; DEKRAW=null;
    if (v) showUnlock(v,'Gesperrt. Entsperre mit Face ID.');
  }
});
window.addEventListener('pagehide',()=>{ if (saveTimer) saveNow(); });

$('#view').addEventListener('change',e=>{ if (e.target.dataset.p) onInput(e); });
document.addEventListener('click',e=>{ if ($('#app').hidden) return; onClick(e); });

$('#verInfo').textContent='Version '+WEBVER;

async function boot(){
  if (!window.crypto || !crypto.subtle){ LK.set('Dieser Browser bietet keine sichere Verschlüsselung an. Öffne die App in Safari oder Chrome über ihre https-Adresse.'); return; }
  try { localStorage.setItem('vm.t','1'); localStorage.removeItem('vm.t'); } catch(e){ LK.set('Speichern ist in diesem Modus nicht möglich (z. B. privates Surfen). Öffne die App in einem normalen Fenster.'); return; }
  let v=null; try { const s=localStorage.getItem(WEB_KEY); v=s?JSON.parse(s):null; } catch(e){}
  if (!v) return showWelcome();
  CUR_VAULT = JSON.stringify(v);
  if (v.locks && (v.locks.prf || v.locks.gate)) return showUnlock(v);
  return unlockDevice(v);
}
boot();
if ('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__vmReady=true;
})();
